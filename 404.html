<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open in ConLoot</title>
  <!-- Catch-all fallback for the universal-link paths (/collectible/<id>,
       /booth/<id>, /convention/<id>) when the ConLoot app ISN'T installed.
       When it IS installed, iOS/Android open the app before this page renders.
       GitHub Pages is static and can't route a dynamic id, so Jekyll serves
       this single 404.html for every unmatched path.
       NOTE: the OG tags below are static — link-preview crawlers don't run the
       JS, so real per-item previews (title/image in iMessage, X, etc.) need
       server-rendered OG. See the runbook's Phase 4.2. -->
  <meta property="og:title" content="ConLoot" />
  <meta property="og:description" content="Track convention exclusives, vendors, and real eBay prices." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://conloot.app/" />
  <meta property="og:image" content="https://conloot.app/og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ConLoot" />
  <meta name="twitter:description" content="Track convention exclusives, vendors, and real eBay prices." />
  <meta name="twitter:image" content="https://conloot.app/og-default.png" />
  <style>
    :root {
      --ink: #0f1012;
      --card: #17181b;
      --text: #f2f0ea;
      --muted: #a8a49b;
      --gold: #d9a441;
      --crimson: #b23a3a;
      --border: #2a2b2f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--ink);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 { font-size: 22px; font-weight: 500; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .btn-primary { background: var(--crimson); color: #fff; border-color: var(--crimson); }
    .btn-ghost { background: transparent; color: var(--text); }
    .store-row { display: flex; gap: 10px; }
    .store-row .btn { margin-bottom: 0; }
    .open-app { display: inline-block; margin-top: 16px; font-size: 14px; color: var(--gold); text-decoration: none; }
    .hidden { display: none !important; }
    .links { margin-top: 22px; font-size: 13px; }
    .links a { color: var(--muted); text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Open in ConLoot</h1>
    <p id="lead">This link opens in the ConLoot app. Don’t have it yet? Grab it below.</p>

    <a class="btn btn-primary" id="ios-store" href="https://apps.apple.com/app/id6772773090">Get it on the App Store</a>

    <a class="open-app hidden" id="open-app" href="conloot:///">Already have the app? Open it &rarr;</a>

    <div class="links">
      <a href="/">Home</a>·<a href="/about/">About</a>·<a href="/privacy/">Privacy</a>·<a href="/terms/">Terms</a>·<a href="/support/">Support</a>
    </div>
  </div>

  <script>
    // Tailor the copy + the "open it" deep link to the entity in the path.
    // (No per-platform store-redirect logic here; if store fallbacks are added
    //  later, branch on the UA for App Store vs Google Play.)
    (function () {
      var parts = window.location.pathname.replace(/^\/+/, '').split('/');
      // In-app these routes are collectible/<id>, booth/<id> (a vendor booth),
      // convention/<id> (an event) — see app/_layout.tsx's deep-link allowlist.
      var LABELS = { collectible: 'collectible', booth: 'vendor booth', convention: 'convention' };
      var label = LABELS[parts[0]];
      var lead = document.getElementById('lead');
      var openApp = document.getElementById('open-app');

      if (label && parts[1]) {
        // Known entity: offer the custom-scheme deep link for visitors who DO
        // have the app but still landed here (some in-app browsers skip
        // universal links). Mirrors lib/share.ts buildDeepLink():
        // conloot:///collectible/<id>.
        openApp.setAttribute('href', 'conloot:///' + parts[0] + '/' + encodeURIComponent(parts[1]));
        openApp.classList.remove('hidden');
        lead.textContent = 'This link opens a ' + label + ' in ConLoot. Install the app to view it.';
      } else {
        lead.textContent = 'Get ConLoot to track convention exclusives, vendors, and real eBay prices.';
      }
    })();
  </script>
</body>
</html>
