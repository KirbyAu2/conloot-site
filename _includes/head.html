<!-- Override of minima v2.5.1's _includes/head.html, verbatim except the last
     line: GitHub Pages bundles minima 2.x, whose head has NO custom-head hook
     (that arrived in minima 3), so pulling in _includes/custom-head.html —
     the Cloudflare Web Analytics beacon — requires owning the head. If the
     Pages theme ever moves to minima 3, delete this file and the built-in
     hook takes over. -->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  {%- include custom-head.html -%}
</head>
